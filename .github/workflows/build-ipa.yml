name: Build MoyuTool IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Generate Xcode project
        run: python3 Scripts/gen_xcodeproj.py

      - name: Build unsigned IPA
        run: bash Scripts/build-ipa.sh unsigned

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MoyuTool-unsigned-ipa
          path: build/MoyuTool.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore
